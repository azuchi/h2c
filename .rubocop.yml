plugins:
  - rubocop-rake
  - rubocop-rspec
inherit_gem:
  syntax_tree: config/rubocop.yml
AllCops:
  TargetRubyVersion: 3.3
RSpec/ExampleLength:
  Enabled: false
Metrics:
  Enabled: false
RSpec/MultipleExpectations:
  Max: 5
Style/IfUnlessModifier:
  Enabled: false
Style/WhileUntilModifier:
  Enabled: false
Naming/MethodParameterName:
  Enabled: false
RSpec/SpecFilePathFormat:
  Enabled: false
RSpec/SpecFilePathSuffix:
  Enabled: false