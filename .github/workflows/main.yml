name: Ruby

on:
  push:
    branches:
      - master

  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          - '3.3'
          - '3.4'
          - '4.0'

    steps:
    - uses: actions/checkout@v4
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - name: syntax_tree
      run: bundle exec stree check Gemfile Rakefile h2c.gemspec 'lib/**/*.rb' 'spec/**/*.rb'
    - name: rubocop
      run: bundle exec rubocop .
    - name: Run the default task
      run: bundle exec rake
